[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspo-lab"
version = "0.1.0"
description = "Reproduce and extend Yang et al. (arXiv:2610.25092): conformal prediction-enabled sequence-level policy optimization (CSPO) for reasoning language models, on a small CPU testbed"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
